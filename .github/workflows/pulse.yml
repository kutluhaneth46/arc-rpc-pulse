name: Pulse

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "docs/data.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Arc Testnet RPCs
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { pulseAll } from './lib/pulse.mjs';
            const data = await pulseAll();
            fs.writeFileSync('docs/data.json', JSON.stringify(data, null, 2));
            console.log(JSON.stringify(data.summary));
          "

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "chore: update RPC pulse snapshot"
          git push
